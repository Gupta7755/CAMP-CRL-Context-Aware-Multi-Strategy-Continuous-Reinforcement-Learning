<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Default signal loop: North-South green 30 s, yellow 3 s, all-red 2 s, then East-West green 30 s, yellow 3 s, all-red 2 s, shown at 5x speed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>

  <!-- intersection -->
  <g>
    <rect x="190" y="20" width="80" height="400" fill="#1E293B"/>
    <rect x="20" y="180" width="420" height="80" fill="#1E293B"/>
    <rect x="190" y="180" width="80" height="80" fill="#243247"/>
    <g stroke="#7F8DA6" stroke-width="2" stroke-dasharray="10 10" opacity="0.6">
      <path d="M230 20 V180 M230 260 V420 M20 220 H190 M270 220 H440"/>
    </g>
    <g stroke="#E6EDF7" stroke-width="4" opacity="0.8">
      <path d="M190 176 H230 M230 264 H270 M186 220 V260 M274 180 V220"/>
    </g>

    <!-- N-S cars (move on N-S green: first 30 of 70 s) -->
    <rect x="198" width="22" height="36" rx="5" fill="#3987E5">
      <animate attributeName="y" values="134;440;440;40;134;134" keyTimes="0;0.36;0.37;0.38;0.42;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" width="22" height="36" rx="5" fill="#22D3EE">
      <animate attributeName="y" values="270;-40;-40;400;270;270" keyTimes="0;0.36;0.37;0.38;0.42;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <!-- E-W cars (move on E-W green: 35 to 65 s of 70) -->
    <rect y="228" width="36" height="22" rx="5" fill="#D95926">
      <animate attributeName="x" values="144;144;460;460;40;144" keyTimes="0;0.5;0.86;0.87;0.88;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect y="190" width="36" height="22" rx="5" fill="#C98500">
      <animate attributeName="x" values="280;280;-40;-40;420;280" keyTimes="0;0.5;0.86;0.87;0.88;1" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- two signal heads -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(470 70)">
      <rect width="46" height="122" rx="14" fill="#0B1220" stroke="#2B3A55"/>
      <circle cx="23" cy="24" r="12" fill="#D03B3B"><animate attributeName="opacity" values="0.15;1" keyTimes="0;0.4714" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="23" cy="61" r="12" fill="#FAB219"><animate attributeName="opacity" values="0.15;1;0.15" keyTimes="0;0.4286;0.4714" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="23" cy="98" r="12" fill="#22C55E"><animate attributeName="opacity" values="1;0.15" keyTimes="0;0.4286" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>
      <text x="60" y="56" font-size="18" font-weight="700" fill="#E6EDF7">North–South</text>
      <text x="60" y="80" font-size="13" fill="#7F8DA6">N and S approaches</text>
    </g>
    <g transform="translate(470 250)">
      <rect width="46" height="122" rx="14" fill="#0B1220" stroke="#2B3A55"/>
      <circle cx="23" cy="24" r="12" fill="#D03B3B"><animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;0.9714" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="23" cy="61" r="12" fill="#FAB219"><animate attributeName="opacity" values="0.15;1;0.15" keyTimes="0;0.9286;0.9714" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="23" cy="98" r="12" fill="#22C55E"><animate attributeName="opacity" values="0.15;1;0.15" keyTimes="0;0.5;0.9286" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>
      <text x="60" y="56" font-size="18" font-weight="700" fill="#E6EDF7">East–West</text>
      <text x="60" y="80" font-size="13" fill="#7F8DA6">E and W approaches</text>
    </g>

    <!-- timeline -->
    <g transform="translate(690 60)">
      <text x="0" y="0" font-size="20" font-weight="800" fill="#E6EDF7">Default loop when all roads are clear</text>
      <rect x="0" y="14" width="300" height="3" rx="1.5" fill="url(#rule)"/>
      <text x="0" y="44" font-size="13" fill="#A9B6CC">70 s cycle shown at 5× speed · traffic seen → CAMP adapts the green</text>

      <text x="0" y="92" font-size="13" fill="#A9B6CC">N–S</text>
      <g transform="translate(46 76)">
        <rect width="196.4" height="22" rx="4" fill="#22C55E" opacity="0.85"/>
        <rect x="196.4" width="19.6" height="22" fill="#FAB219"/>
        <rect x="216" width="244" height="22" rx="4" fill="#D03B3B" opacity="0.75"/>
      </g>
      <text x="0" y="136" font-size="13" fill="#A9B6CC">E–W</text>
      <g transform="translate(46 120)">
        <rect width="229" height="22" rx="4" fill="#D03B3B" opacity="0.75"/>
        <rect x="229" width="196.4" height="22" fill="#22C55E" opacity="0.85"/>
        <rect x="425.4" width="19.6" height="22" fill="#FAB219"/>
        <rect x="445" width="15" height="22" fill="#D03B3B" opacity="0.75"/>
      </g>
      <line x1="46" y1="68" x2="46" y2="150" stroke="#E6EDF7" stroke-width="2">
        <animate attributeName="x1" values="46;506" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="46;506" dur="14s" repeatCount="indefinite"/>
      </line>
      <g font-size="12" fill="#7F8DA6">
        <text x="46" y="172">0 s</text><text x="226" y="172">30</text><text x="270" y="172">35</text>
        <text x="460" y="172">65</text><text x="490" y="172">70</text>
      </g>

      <g transform="translate(0 210)" font-size="14">
        <rect width="14" height="14" rx="3" fill="#22C55E" y="-12"/><text x="22" y="0" fill="#E6EDF7">Green 30 s <tspan fill="#7F8DA6">(adaptive: 10–60 s)</tspan></text>
        <rect y="14" width="14" height="14" rx="3" fill="#FAB219"/><text x="22" y="26" fill="#E6EDF7">Yellow 3 s <tspan fill="#7F8DA6">(fixed for safety)</tspan></text>
        <rect y="40" width="14" height="14" rx="3" fill="#D03B3B"/><text x="22" y="52" fill="#E6EDF7">All-red 2 s <tspan fill="#7F8DA6">· no road red &gt; 120 s</tspan></text>
      </g>
    </g>
  </g>
</svg>
