<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="SignalSense AI: context-aware adaptive traffic signals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#0E1A30"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.6" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glowA)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glowB)"/>

  <!-- road grid hint -->
  <g stroke="#2B3A55" stroke-width="1" opacity="0.5">
    <path d="M820 0 V300 M980 0 V300 M700 150 H1200"/>
  </g>
  <!-- moving cars along the roads -->
  <g>
    <rect x="-40" y="140" width="26" height="12" rx="3" fill="#3987E5">
      <animate attributeName="x" values="700;1210" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-40" y="158" width="26" height="12" rx="3" fill="#22D3EE" opacity="0.8">
      <animate attributeName="x" values="1210;700" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="814" y="-30" width="12" height="24" rx="3" fill="#60A5FA">
      <animate attributeName="y" values="-30;310" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- logo tile with cycling signal -->
  <g transform="translate(64 78)">
    <rect width="96" height="96" rx="26" fill="url(#tile)"/>
    <rect x="31" y="12" width="34" height="72" rx="17" fill="#0B1220"/>
    <circle cx="48" cy="30" r="8.5" fill="#D03B3B">
      <animate attributeName="opacity" values="1;1;0.18;0.18;0.18;1" keyTimes="0;0.45;0.46;0.88;0.99;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="48" r="8.5" fill="#FAB219">
      <animate attributeName="opacity" values="0.18;0.18;1;1;0.18" keyTimes="0;0.88;0.89;0.99;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="66" r="8.5" fill="#22C55E">
      <animate attributeName="opacity" values="0.18;0.18;1;1;0.18" keyTimes="0;0.46;0.47;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="190" y="128" font-size="58" font-weight="800" fill="#E6EDF7" letter-spacing="-1.5">SignalSense <tspan fill="url(#title)">AI</tspan></text>
    <rect x="192" y="146" width="420" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="192" y="184" font-size="22" font-weight="500" fill="#A9B6CC">Context-aware adaptive traffic signals</text>
    <text x="192" y="216" font-size="16" fill="#7F8DA6">CAMP context · continuous RL · camera perception · safety-filtered · simulation &amp; advisory only</text>
  </g>
</svg>
