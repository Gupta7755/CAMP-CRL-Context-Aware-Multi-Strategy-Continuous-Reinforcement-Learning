<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="SignalSense AI workflow: SUMO and cameras feed the traffic state, CAMP context, strategy selection, CAMP prior and RL policy, adaptive fusion, the safety filter, then the simulated signal or the live advisory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3A7A"/><stop offset="1" stop-color="#0E5566"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>

  <!-- edges -->
  <g fill="none" stroke="url(#edge)" stroke-width="2.2" marker-end="url(#arrow)" opacity="0.9">
    <path id="e1" d="M220 100 C255 100 255 160 290 160"/>
    <path id="e2" d="M220 220 C255 220 255 160 290 160"/>
    <path id="e3" d="M470 160 H520"/>
    <path id="e4" d="M700 160 H750"/>
    <path id="e5" d="M930 160 C955 160 955 100 980 100"/>
    <path id="e6" d="M930 160 C955 160 955 220 980 220"/>
    <path id="e7" d="M1160 100 C1192 100 1192 390 1160 390"/>
    <path id="e8" d="M1070 250 V360"/>
    <path id="e9" d="M980 390 H930"/>
    <path id="e10" d="M750 390 C725 390 725 340 700 340"/>
    <path id="e11" d="M750 390 C725 390 725 450 700 450"/>
  </g>
  <path id="e12" d="M520 340 H70 C14 340 14 100 40 100" fill="none" stroke="#3987E5" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="300" y="332" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#7F8DA6">next simulation step (1 s)</text>

  <!-- data pulses -->
  <g fill="#67E3F5" filter="url(#soft)">
    <circle r="4.5"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#e1"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.3s"><mpath xlink:href="#e2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.5s"><mpath xlink:href="#e3"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.8s"><mpath xlink:href="#e4"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" begin="1.0s"><mpath xlink:href="#e5"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#e6"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.3s"><mpath xlink:href="#e7"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.0s" repeatCount="indefinite" begin="1.4s"><mpath xlink:href="#e8"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="0.8s" repeatCount="indefinite" begin="1.8s"><mpath xlink:href="#e9"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.0s" repeatCount="indefinite" begin="2.0s"><mpath xlink:href="#e10"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.0s" repeatCount="indefinite" begin="2.1s"><mpath xlink:href="#e11"/></animateMotion></circle>
  </g>

  <!-- boxes -->
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <g transform="translate(40 70)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">SUMO + TraCI</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">4-arm junction · ground truth</text></g>
    <g transform="translate(40 190)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Phone cameras</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">YOLOX + ByteTrack-style</text></g>
    <g transform="translate(290 130)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Traffic state</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">queues · arrivals · waits</text></g>
    <g transform="translate(520 130)"><rect width="180" height="60" rx="12" fill="url(#hot)" stroke="#2563EB"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">CAMP context</text>
      <text x="14" y="46" font-size="11.5" fill="#A9B6CC">pressure · momentum · risk</text></g>
    <g transform="translate(750 130)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Strategy</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">normal · surge · fairness</text></g>
    <g transform="translate(980 70)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">CAMP prior</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">rule-based action</text></g>
    <g transform="translate(980 190)"><rect width="180" height="60" rx="12" fill="url(#hot)" stroke="#06B6D4"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">RL policy</text>
      <text x="14" y="46" font-size="11.5" fill="#A9B6CC">TD3 / DDPG / SAC</text></g>
    <g transform="translate(980 360)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Adaptive fusion</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">a = (1-α)·CAMP + α·RL</text></g>
    <g transform="translate(750 360)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#D03B3B" stroke-opacity="0.7"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Safety filter</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">min/max green · 3 s Y · 2 s R</text></g>
    <g transform="translate(520 310)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#2B3A55"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Signal in SUMO</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">simulation · metrics</text></g>
    <g transform="translate(520 420)"><rect width="180" height="60" rx="12" fill="url(#box)" stroke="#FAB219" stroke-opacity="0.6"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#E6EDF7">Live advisory</text>
      <text x="14" y="46" font-size="11.5" fill="#7F8DA6">recommend only</text></g>

    <!-- phase legend -->
    <g transform="translate(40 40)" font-size="12">
      <rect width="12" height="12" rx="3" fill="#1D3A7A" y="-10" stroke="#2563EB"/><text x="18" y="0" fill="#A9B6CC">learning / context core</text>
      <rect x="170" width="12" height="12" rx="3" fill="#1E293B" y="-10" stroke="#D03B3B" stroke-opacity="0.7"/><text x="188" y="0" fill="#A9B6CC">only component that sets signals</text>
      <text x="420" y="0" fill="#7F8DA6">Cameras only add vehicles to SUMO or feed the advisory; nothing here controls a real signal.</text>
    </g>
  </g>
</svg>
